[project]
name = "oidc-caep-risc"
version = "0.2.1"
description = "Server-side OpenID Connect confidential client: Authorization Code with PKCE, client authentication, and a CAEP and RISC Shared Signals receiver."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Iya CyberSecurity Solutions, LLC" }]
dependencies = ["cryptography"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
oidc-caep-risc = "oidc_caep_risc.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/rcbj/oidc-caep-risc-python"
Repository = "https://github.com/rcbj/oidc-caep-risc-python"
Issues = "https://github.com/rcbj/oidc-caep-risc-python/issues"
